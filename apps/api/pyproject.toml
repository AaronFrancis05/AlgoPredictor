[project]
name = "algopredict-api"
version = "0.1.0"
description = "AlgoPredict API - subscription access to model-based football predictions"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "redis==5.3.1",          # arq 0.28 does not support redis 6+
    "arq==0.28.0",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.14.0", # RS256 (Google ID tokens) needs cryptography
    "cryptography==50.0.1",
    "stripe==15.6.1",
    "httpx==0.28.1",
    "prometheus-fastapi-instrumentator==8.1.0",
    "structlog==26.1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
    "fakeredis==2.38.0",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]   # fixed test credentials
